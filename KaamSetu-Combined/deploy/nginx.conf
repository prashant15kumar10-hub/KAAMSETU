# Sample nginx site for the systemd route. Get the certificate with certbot (certbot --nginx -d kaamsetu.example.com).
# IMPORTANT: the app trusts the FIRST X-Forwarded-For entry when TRUST_PROXY=true, so nginx must SET it to the real client
# address ($remote_addr), never append to what a visitor sent - otherwise login rate limits can be bypassed.
server {
    listen 80;
    server_name kaamsetu.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name kaamsetu.example.com;
    ssl_certificate     /etc/letsencrypt/live/kaamsetu.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaamsetu.example.com/privkey.pem;
    client_max_body_size 100k;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
